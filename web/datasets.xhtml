<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Data Set Management</title>
    <meta charset="UTF-8"/>
    <h:outputStylesheet library="css" name="style.css" />
</h:head>

<h:body>
    <p:growl id="growlMessages" showDetail="true" life="4000" />

    <h2>Survey Data Sets Management</h2>

    <div class="main-layout">
        <!-- Left Form: Create / Update Data Set -->
        <h:form id="dsForm" styleClass="left-panel">
            <p:panel header="Create / Update Data Set">
                <p:panelGrid columns="2" layout="flex" styleClass="ui-fluid"
                             columnClasses="col-12 md:col-4, col-12 md:col-8">
                    <p:outputLabel for="dsId" value="Data Set ID:"/>
                    <p:inputText id="dsId" value="#{empty dataSetController.selectedDataSet.dataSetId ? 'Auto-generated' : dataSetController.selectedDataSet.dataSetId}" disabled="true"/>

                    <p:outputLabel for="dsName" value="Name:"/>
                    <p:inputText id="dsName" value="#{dataSetController.selectedDataSet.dataSetName}" maxlength="20" required="true" placeholder="Max 20 characters"/>

                    <p:outputLabel for="dsDesc" value="Description:"/>
                    <p:inputTextarea id="dsDesc" value="#{dataSetController.selectedDataSet.dataSetDescription}" rows="3" required="true"/>

                    <p:outputLabel for="startDate" value="Start Date:"/>
                    <p:datePicker id="startDate" value="#{dataSetController.selectedDataSet.startDate}" pattern="yyyy-MM-dd" required="true"/>

                    <p:outputLabel for="endDate" value="End Date:"/>
                    <p:datePicker id="endDate" value="#{dataSetController.selectedDataSet.endDate}" pattern="yyyy-MM-dd" showButtonBar="true"/>
                </p:panelGrid>

                <div class="action-container" style="margin-top: 15px;">
                    <p:commandButton value="Save Data Set" action="#{dataSetController.saveDataSet()}" 
                                     update="dsForm :dsTableForm:dsTable :growlMessages" icon="pi pi-check" style="width: auto; margin-right: 10px;"/>
                    <p:commandButton value="New / Clear" action="#{dataSetController.prepareNewDataSet()}" 
                                     update="dsForm" icon="pi pi-refresh" styleClass="ui-button-secondary" style="width: auto;" process="@this"/>
                </div>
            </p:panel>
        </h:form>

        <!-- Right Table: Data Set List -->
        <h:form id="dsTableForm" styleClass="right-panel">
            <p:dataTable id="dsTable" value="#{dataSetController.dataSets}" var="ds"
                         selectionMode="single" selection="#{dataSetController.selectedDataSet}" rowKey="#{ds.dataSetId}">
                <p:ajax event="rowSelect" update=":dsForm" />

                <p:column headerText="ID" width="60"><h:outputText value="#{ds.dataSetId}"/></p:column>
                <p:column headerText="Name" width="160"><h:outputText value="#{ds.dataSetName}"/></p:column>
                <p:column headerText="Description"><h:outputText value="#{ds.dataSetDescription}"/></p:column>
                <p:column headerText="Start Date" width="110"><h:outputText value="#{ds.startDate}"/></p:column>
                <p:column headerText="End Date" width="140"><h:outputText value="#{empty ds.endDate ? 'Active (No End)' : ds.endDate}"/></p:column>
            </p:dataTable>
        </h:form>
    </div>

    <!-- Bottom Footer Bar -->
    <h:form id="logoutForm">
        <div class="page-footer">
            <span>
                Logged in as: <strong>#{loginController.currentUser.firstName} #{loginController.currentUser.lastName}</strong>
                <span style="color: #6c757d; font-size: 0.9em;">(#{loginController.currentUser.role})</span>
            </span>
            <div style="display: flex; align-items: center; gap: 10px;">
                <p:button value="Back to Survey Reports" outcome="index" icon="pi pi-arrow-left" styleClass="ui-button-outlined" />
                <p:commandButton value="Logout" action="#{loginController.logout()}" icon="pi pi-sign-out" styleClass="ui-button-secondary ui-button-outlined" process="@this" />
            </div>
        </div>
    </h:form>
</h:body>
</html>
